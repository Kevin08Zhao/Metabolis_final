name: Land PixelLab fetch plans

on:
  push:
    branches-ignore:
      - main
    paths:
      - "fetch_plans/**/*.json"
  workflow_dispatch:
    inputs:
      plan:
        description: Repository-relative fetch plan path
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pixellab-land-${{ github.ref }}
  cancel-in-progress: false

jobs:
  land:
    if: github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out the task branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the deterministic image dependency
        run: python -m pip install "Pillow>=10,<13"

      - name: Resolve changed fetch plans
        id: plans
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          MANUAL_PLAN: ${{ inputs.plan }}
        run: |
          set -euo pipefail
          : > .pixellab_plans
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s\n' "$MANUAL_PLAN" > .pixellab_plans
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git ls-tree -r --name-only "$CURRENT_SHA" -- fetch_plans \
              | awk '/\.json$/ { print }' > .pixellab_plans
          else
            git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- fetch_plans \
              | awk '/\.json$/ { print }' > .pixellab_plans
          fi
          sort -u -o .pixellab_plans .pixellab_plans
          if [[ ! -s .pixellab_plans ]]; then
            echo "No JSON fetch plan was selected." >&2
            exit 1
          fi
          while IFS= read -r plan; do
            if [[ "$plan" != fetch_plans/*.json || ! -f "$plan" ]]; then
              echo "Unsafe or missing fetch plan: $plan" >&2
              exit 1
            fi
          done < .pixellab_plans

      - name: Fetch, normalize, and validate every plan
        id: land
        continue-on-error: true
        run: |
          set +e
          : > .pixellab_land_paths
          land_status=0
          while IFS= read -r plan; do
            python tools/pixellab_fetch.py land "$plan" \
              --repo-root "$GITHUB_WORKSPACE" \
              --paths-file .pixellab_land_paths
            item_status=$?
            if [[ "$item_status" -ne 0 ]]; then
              land_status=1
            fi
          done < .pixellab_plans
          echo "status=$land_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit successful PNG files and all landing evidence
        if: always() && steps.plans.outcome == 'success'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! -s .pixellab_land_paths ]]; then
            echo "The lander produced no committable paths." >&2
            exit 1
          fi
          sort -u -o .pixellab_land_paths .pixellab_land_paths
          if grep -E '^docs/coord/done/' .pixellab_land_paths; then
            echo "The landing workflow is forbidden from creating DONE markers." >&2
            exit 1
          fi
          git add --pathspec-from-file=.pixellab_land_paths
          if git diff --cached --quiet; then
            echo "All landed files were already identical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(art): land PixelLab outputs [skip pixellab-land]"
          git push origin "HEAD:$BRANCH_NAME"

      - name: Mark the workflow red when any item failed
        if: always() && steps.plans.outcome == 'success' && steps.land.outputs.status != '0'
        run: |
          echo "At least one fetch-plan item failed; successful items and evidence were retained." >&2
          exit 1
